[project]
name = "ocrdownloader2"
version = "3.2.0"
description = "Download songs from OC ReMix before packs are available"
authors = [{ name = "Anthony Porthouse", email = "anthony@porthou.se" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.9.3,<5",
    "click>=8.0.0,<9",
    "html5lib~=1.1",
    "requests>=2.25.1,<3",
]

[project.scripts]
ocrdownloader = "ocrdownloader2.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.4,<10.0",
    "requests-mock>=1.9.2,<2",
    "coverage~=7.4",
    "pytest-subprocess>=1.1.0,<2",
    "pytest-mock>=3.14.0,<4",
    "isort>=6,<8",
    "ruff>=0.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "ruff"
src_paths = ["ocrdownloader2", "test"]

[tool.ruff]

[tool.coverage.run]
source = ['ocrdownloader2']
